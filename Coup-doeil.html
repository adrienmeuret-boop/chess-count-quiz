<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coup d’œil · Vision échiquéenne</title>
<style>
:root{color-scheme:dark;background:#181b19;color:#f5f1e6;font:17px system-ui;--accent:#eab66b}
body{max-width:1040px;margin:0 auto;padding:clamp(16px,4vw,44px)}
h1{font-size:clamp(2rem,5vw,3.5rem);margin:0 0 14px;line-height:1}
main{display:grid;grid-template-columns:minmax(0,540px) minmax(0,1fr);gap:28px;align-items:start}
nav,.actions{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
button,select{font:inherit;color:inherit;border:1px solid #737b70;background:#292e2b;border-radius:8px;padding:9px 13px}
button:not(:disabled){cursor:pointer}button:disabled{opacity:.5}button:focus-visible,select:focus-visible{outline:3px solid #eab66b;outline-offset:2px}
button.primary{background:var(--accent);color:#201a13;border-color:var(--accent);font-weight:700}
button[aria-pressed=true]{border-color:var(--accent)}
#frame{position:relative;isolation:isolate;max-width:540px}
#board{display:grid;grid-template-columns:repeat(8,1fr);aspect-ratio:1;overflow:hidden;border-radius:8px}
.sq{min-width:0;border:0;border-radius:0;padding:0;position:relative;font-family:'Segoe UI Symbol','DejaVu Sans',sans-serif;font-size:clamp(23px,7vw,55px);line-height:1;color:#25231e;background:#e6d4af}
.sq.dark{background:#8b9b7c}.sq[aria-pressed=true]{box-shadow:inset 0 0 0 4px #e99832}
.sq:focus-visible{outline-offset:-4px;z-index:2}.coord{position:absolute;bottom:3px;left:4px;font:700 clamp(8px,1.6vw,12px) system-ui}
#arrow{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#question{font-size:1.35rem;min-height:3em;margin:8px 0 14px}
#feedback{min-height:2.8em;margin:0 0 14px}#status,.muted{color:#c4c8bd}
a{color:#f0c789}table{width:100%;border-collapse:collapse;font-size:.9rem}th,td{text-align:left;padding:7px 4px;border-bottom:1px solid #4b534b}
@media(max-width:720px){main{grid-template-columns:1fr;gap:14px}#question{min-height:auto}#frame{max-width:min(100%,55vh)}}
</style>

  </div>
  <p id="help" class="muted"></p>
  <div class="actions">
   <button id="action" class="primary">Afficher</button>
   <button id="clear" hidden>Effacer</button>
   <button id="skip" hidden>Passer</button>
  </div>
  <p id="feedback" aria-live="polite"></p>
  <a id="source" target="_blank" rel="noopener" hidden>Revoir la partie</a>
  <h2>Progrès</h2>
  <div id="stats"></div>
  <div id="test-review"></div>
 </section>
</main>

"white":false,"attacker":5,"victim":2,"link":["d1","d2"],"reserve":false,"distance":1,"prior":false,"source":"https://lichess.org/T1cOA7yD#44"},{"fen":"r4rk1/p4q1p/b1p1p3/3pP3/1P3P2/2P1QKP1/1P4B1/R6R","white":false,"attacker":4,"victim":3,"link":["a1","a6"],"reserve":false,"distance":5,"prior":true,"source":"https://lichess.org/T1cOA7yD#51"},{"fen":"r1bqkb1r/ppp3pp/2n2p2/3Bp1N1/3P4/8/PPP2PPP/RNBQK2R","white":true,"attacker":5,"victim":3,"link":["d8","d5"],"reserve":false,"distance":3,"prior":false,"source":"https://lichess.org/YsI3aFdk#13"},{"fen":"r1b1kb1r/ppp3pp/2n2p2/4p1N1/3P4/2N5/PPP2PqP/R1BQK2R","white":true,"attacker":5,"victim":4,"link":["g2","h1"],"reserve":false,"distance":1,"prior":true,"source":"https://lichess.org/YsI3aFdk#16"},{"fen":"r5k1/ppp3pp/3b4/3Np3/8/2P2N2/PPK4P/2R1Br2","white":true,"attacker":4,"victim":2,"link":["f1","f3"],"reserve":false,"distance":2,"prior":false,"source":"https://lichess.org/YsI3aFdk#41"},{"fen":"r1bq1rk1/1p3ppp/p2p4/1P6/P2Pp2N/1Q5P/1B3K2/R6R","white":true,"attacker":5,"victim":2,"link":["d8","h4"],"reserve":false,"distance":4,"prior":false,"source":"https://lichess.org/3HGGUsGc#47"},{"fen":"r1b1k2r/pppp1Npp/5Q2/4p3/2BnP3/8/PPPP1KPP/RNB4R","white":true,"attacker":1,"victim":5,"link":["g7","f6"],"reserve":false,"distance":1,"prior":false,"source":"https://lichess.org/TCPk8O5c#17"},{"fen":"r1b2k1N/pppp1B1p/5p2/4p3/4P3/8/PPnP1KPP/RNB4R","white":true,"attacker":2,"victim":4,"link":["c2","a1"],"reserve":false,"distance":2,"prior":true,"source":"https://lichess.org/TCPk8O5c#22"},{"fen":"r5b1/6P1/1kpp2RB/1p2p3/p2NP2P/2N5/PP3K2/3B4","white":true,"attacker":1,"victim":2,"link":["e5","d4"],"reserve":false,"distance":1,"prior":false,"source":"https://lichess.org/TCPk8O5c#65"}];
const names = ['', 'pion', 'cavalier', 'fou', 'tour', 'dame', 'roi'];
const pieces = {K:'♔',Q:'♕',R:'♖',B:'♗',N:'♘',P:'♙',k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'};
const get = id => document.getElementById(id);
const limit = 12;
const key = 'coup-doeil-v1';
const reserveBank = positions.filter(item => item.reserve);
const shortBank = reserveBank.filter(item => item.distance < 4);
const longBank = reserveBank.filter(item => item.distance >= 4);
const testBank = Array.from({length:4}, (_, i) => {
 const pack = shortBank.slice(i*11,i*11+11);
 pack.splice(2+i*2,0,longBank[i]);
 return pack;
}).flat();
let saved = {seen:{}, visits:[], testOffset:0};
try { saved = JSON.parse(localStorage.getItem(key)) ?? saved; } catch {}
let mode = 'train', queue, current, phase, picked, results, started, timer, shown;
const persist = () => { try { localStorage.setItem(key, JSON.stringify(saved)); } catch {} };

function start(nextMode) {
 clearTimeout(timer);
 mode = nextMode;
 results = [];
 const bank = positions.filter(item => item.reserve === (mode === 'test'));
 if (mode === 'test') {
  const offset = saved.testOffset;
  queue = testBank.slice(offset,Math.ceil((offset+1)/limit)*limit);
 } else {
  const random = new Map(bank.map(item => [item, Math.random()]));
  queue = bank.sort((a,b) => (saved.seen[a.fen] ?? 0)-(saved.seen[b.fen] ?? 0) ||
   random.get(a)-random.get(b) || a.fen.localeCompare(b.fen));
  const long = queue.filter(item => item.distance >= 4 && [3,5].includes(item.attacker)).slice(0,4);
  queue = [...long,...queue.filter(item => !long.includes(item)).slice(0,limit-long.length)]
   .sort((a,b) => random.get(a)-random.get(b));
 }
 get('train').setAttribute('aria-pressed', String(mode === 'train'));
 get('test').setAttribute('aria-pressed', String(mode === 'test'));
 get('options').hidden = mode === 'test';
 get('help').textContent = mode === 'test'
  ? 'Plateau visible. Les positions du test sont réservées et utilisées une fois sur ce navigateur. Les corrections apparaissent à la fin.'
  : 'Lis la question, affiche la position, puis clique sur la pièce adverse et sur sa cible. Le chrono du flash s’arrête avant la saisie.';
 next();
}

function next() {
 current = queue[results.length];
 picked = [];
 phase = current ? 'ready' : 'done';
 render();
}

function boardPieces() {
 const squares = {};
 if (!current || !shown) return squares;
 current.fen.split('/').forEach((row, index) => {
  let file = 0;
  for (const char of row) {
   if (/\d/.test(char)) file += Number(char);
   else squares['abcdefgh'[file++] + (8-index)] = char;
  }
 });
 return squares;
}

function squareOrder() {
 const flip = current && !current.white;
 const files = flip ? 'hgfedcba' : 'abcdefgh';
 const ranks = flip ? '12345678' : '87654321';
 return Array.from(ranks).flatMap(rank => Array.from(files, file => file + rank));
}

function drawBoard() {
 const data = boardPieces();
 const order = squareOrder();
 get('board').replaceChildren(...order.map((square, index) => {
  const button = document.createElement('button');
  button.className = 'sq' + ((index + Math.floor(index/8)) % 2 ? ' dark' : '');
  button.disabled = phase !== 'answer';
  button.setAttribute('aria-pressed', String(picked.includes(square)));
  const piece = data[square];
  button.setAttribute('aria-label', square + (piece ? ' ' + names[' pnbrqk'.indexOf(piece.toLowerCase())] +
   (piece === piece.toUpperCase() ? ' blanc' : ' noir') : ''));
  button.textContent = pieces[piece] ?? '';
  if (phase !== 'flash') {
   const coord = document.createElement('span');
   coord.className = 'coord';
   coord.textContent = square;
   coord.setAttribute('aria-hidden','true');
   button.append(coord);
  }
  button.addEventListener('click', () => {
   if (picked.length === 2) picked = [];
   picked.push(square);
   drawBoard();
   if (picked.length === 2) get('action').focus();
   else get('board').children[index].focus();
  });
  return button;
 }));
 get('action').disabled = phase === 'flash' || (phase === 'answer' && picked.length !== 2);
 const arrow = get('arrow');
 arrow.replaceChildren();
 if (phase === 'review') {
  const [a,b] = current.link.map(s => order.indexOf(s));
  const line = document.createElementNS('http://www.w3.org/2000/svg','line');
  const attributes = {x1:a%8+.5,y1:Math.floor(a/8)+.5,x2:b%8+.5,y2:Math.floor(b/8)+.5,
   stroke:'#a04b16','stroke-width':'.13','marker-end':'url(#tip)'};
  arrow.innerHTML = '<defs><marker id="tip" markerWidth="4" markerHeight="4" refX="3" refY="2" orient="auto"><path d="M0 0L4 2L0 4Z" fill="#a04b16"/></marker></defs>';
  for (const [name,value] of Object.entries(attributes)) line.setAttribute(name,value);
  arrow.append(line);
 }
}

function render() {
 shown = phase === 'flash' || phase === 'review' || (phase === 'answer' && (mode === 'test' || Number(get('duration').value) === 0));
 get('duration').disabled = phase !== 'ready' && phase !== 'done';
 get('status').textContent = current ? 'Position '+(results.length + (phase === 'review' ? 0 : 1))+' / '+queue.length+
  ' · Tu joues les '+(current.white ? 'Blancs' : 'Noirs') : '';
 get('question').textContent = current ? (current.attacker === 4 || current.attacker === 5 ? 'Quelle ' : 'Quel ')+names[current.attacker]+' adverse attaque '+(current.victim >= 4 ? 'une ' : 'un ')+
  'de tes '+names[current.victim]+'s ?' :
  (results.length ? 'Série terminée' : 'Toutes les positions réservées ont été utilisées.');
 get('action').textContent = {ready:'Afficher',flash:'Observe',answer:'Valider',review:results.length === queue.length ? 'Terminer' : 'Suivante',done:'Nouvelle série'}[phase];
 get('action').hidden = phase === 'done' && mode === 'test' && !results.length;
 get('clear').hidden = get('skip').hidden = phase !== 'answer';
 get('source').hidden = phase !== 'review';
 if (phase === 'review') get('source').href = current.source;
 get('feedback').textContent = phase === 'review' ? (results.at(-1).ok ? 'Exact. ' : 'Le lien attendu était ') +
  current.link.join(' → ') + '.' : phase === 'done' && results.length ?
  results.filter(result => result.ok).length+' / '+results.length+' exactes.' : '';
 drawBoard();
 drawStats();
 const review = get('test-review');
 review.replaceChildren();
 if (mode === 'test' && phase === 'done' && results.length) {
  const details = document.createElement('details');
  const summary = document.createElement('summary');
  summary.textContent = 'Revoir les réponses du test';
  details.append(summary);
  results.forEach((item,index) => {
   const p = document.createElement('p');
   const link = document.createElement('a');
   link.href = item.source;
   link.target = '_blank';
   link.rel = 'noopener';
   link.textContent = 'Position '+(index+1)+' · '+item.link.join(' → ');
   p.append(item.ok ? 'Exact · ' : 'À revoir · ',link);
   details.append(p);
  });
  review.append(details);
 }
}

function finishAnswer(skip) {
 const ok = !skip && current.link.every((square,index) => square === picked[index]);
 results.push({ok, ms:performance.now()-started, long:current.distance>=4, source:current.source, link:current.link});
 if (mode === 'test') {
  saved.testOffset++;
 } else {
  saved.seen[current.fen] = (saved.seen[current.fen] ?? 0) + 1;
 }
 if (results.length === queue.length) {
  const accurate = results.filter(result => result.ok).map(result => result.ms).sort((a,b)=>a-b);
  const n = accurate.length;
  const long = results.filter(result => result.long);
  saved.visits.push({mode, date:new Date().toISOString(), correct:n, total:results.length,
   ms: n ? (accurate[Math.floor((n-1)/2)]+accurate[Math.floor(n/2)])/2 : null,
   longCorrect:long.filter(result=>result.ok).length, longTotal:long.length});
 }
 persist();
 if (mode === 'train') { phase = 'review'; render(); }
 else next();
}

function drawStats() {
 const root = get('stats');
 const visits = saved.visits.filter(visit => visit.mode === 'test').slice(-8).reverse();
 if (!visits.length) {
  root.textContent = 'Termine un test pour établir ton point de départ.';
  return;
 }
 root.innerHTML = '<table><thead><tr><th>Date</th><th>Exactes</th><th>Lignes longues</th><th>Temps médian*</th></tr></thead><tbody></tbody></table><p class="muted">* Réponses exactes, deux clics compris.</p>';
 for (const visit of visits) {
  const row = root.querySelector('tbody').insertRow();
  for (const value of [new Date(visit.date).toLocaleDateString('fr'), visit.correct+'/'+visit.total,
   visit.longTotal ? visit.longCorrect+'/'+visit.longTotal : '—',
   visit.ms === null ? '—' : (visit.ms/1000).toFixed(1)+' s']) row.insertCell().textContent = value;
 }
}

get('action').addEventListener('click', () => {
 if (phase === 'ready') {
  const ms = mode === 'test' ? 0 : Number(get('duration').value);
  started = performance.now();
  phase = ms ? 'flash' : 'answer';
  render();
  if (ms) timer = setTimeout(() => { phase = 'answer'; render(); }, ms);
 } else if (phase === 'answer') finishAnswer(false);
 else if (phase === 'review') next();
 else if (phase === 'done') start(mode);
 if (!get('action').disabled && !get('action').hidden) get('action').focus();
});
get('clear').addEventListener('click',() => { picked = []; drawBoard(); });
get('skip').addEventListener('click',() => finishAnswer(true));
get('train').addEventListener('click',() => { if (mode !== 'train') start('train'); });
get('test').addEventListener('click',() => { if (mode !== 'test') start('test'); });
start('train');
</script>
